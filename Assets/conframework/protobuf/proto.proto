syntax = "proto3";
package pb;

//账号
message Account{
}

//设置
message Setting{
}

message DefeatPlayerRole{
optional int32 id = 1;				//击败的角色Id
optional int32 diff= 2;				//难度
}

//游戏
message GameData{
  optional int32 gameState = 1;
  optional int32 pageIndex = 2;		
  optional int32 playingId = 3; 		//当前玩角色Id
  optional int32 exp = 4;   			//经验
  repeated DefeatPlayerRole  defeatPlayerRoles = 5;//击败的
}

//游戏财产
message GameProperty{
  optional Account account = 1;
  optional Setting setting = 2;
  optional GameData gameData = 3;
}

//protoc --proto_path=. --csharp_out=. proto.proto
